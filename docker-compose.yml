services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: confluencr-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: 8000
      NODE_ENV: production
    ports:
      - "8002:8000"
    expose:
      - "8000"
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: confluencr-frontend
    restart: unless-stopped
    environment:
      BACKEND_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
